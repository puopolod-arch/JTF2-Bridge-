    <button class="mtab" onclick="switchMain('ss')">SIMPLE & SINISTER</button>
    <button class="mtab" onclick="switchMain('ironcore')">IRON CORE</button>

<script>

// ─── STATE ───────────────────────────────────────────────
let state = {
  mainTab:'bridge',
  bridgeWeek:1,
  bridgeSubTab:'gtg',
  progWeek:1,
  progDay:0,
  ssSubTab:'daily',
  ssDay: new Date().toISOString().slice(0,10),
};
let db = loadDB();

function loadDB(){
  try{ return JSON.parse(localStorage.getItem('jtf2_v3')||'null')||emptyDB(); }
  catch(e){ return emptyDB(); }
}
function saveDB(){ try{ localStorage.setItem('jtf2_v3',JSON.stringify(db)); }catch(e){} }
function emptyDB(){
  const o={ bridge:{days:{},pullups:{},getup:{}}, ss:{log:{}} };
  for(let w=1;w<=4;w++){
    for(let d=1;d<=7;d++) o.bridge.days[`${w}-${d}`]=false;
    o.bridge.pullups[w]={v1:'',v2:'',v3:'',v4:'',v5:'',v6:'',v7:'',v8:''};
    o.bridge.getup[w]={weight:'',reps:'',notes:''};
  }
  return o;
}

function switchMain(tab){
  state.mainTab=tab;
  document.querySelectorAll('.mtab').forEach((b,i)=>{
    b.classList.toggle('active',['bridge','program','ss','ironcore','benchmarks','progression'][i]===tab);
  });
  render();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,1600);
}

function render(){
  const c=document.getElementById('main-content');
  if(state.mainTab==='bridge') c.innerHTML=renderBridge();

function renderBridge(){
  const w=state.bridgeWeek;
  const pu=db.bridge.pullups[w];
  const gu=db.bridge.getup[w];
  let totalDays=0,doneDays=0;
  for(let wk=1;wk<=4;wk++) for(let d=1;d<=7;d++){totalDays++;if(db.bridge.days[`${wk}-${d}`])doneDays++;}
  const pct=Math.round(doneDays/totalDays*100);
  const daily=[1,2,3,4,5,6,7,8].reduce((s,i)=>(s+(parseInt(pu['v'+i])||0)),0);
  const targets=[30,40,50,60];
  const dpct=Math.min(100,Math.round(daily/targets[w-1]*100));
  const subTabs=['gtg','armstrong','getup'];
  const subLabels=['GtG PULL-UPS','ARMSTRONG PLAN','TURKISH GET-UP'];

  return `
    <div class="card-accent">
      <div class="label label-amber" style="margin-bottom:6px">PHASE 1 — 4-WEEK BRIDGE</div>
      <h2>Grease the Groove + Get-Up Learning</h2>
      <p class="body" style="margin-top:6px">Before JTF2 Week 1: build pull-up capacity, aerobic base, and learn the Turkish Get-Up. Keep Recovery A/B from Tactical FF after shifts.</p>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;color:#e0dbd0;font-family:sans-serif">${doneDays} / ${totalDays} days logged</span>
        <span style="font-size:13px;color:#c8963e;font-weight:700;font-family:sans-serif">${pct}%</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="week-selector">
      ${[1,2,3,4].map(wk=>`<button class="wbtn ${wk===w?'active':''}" onclick="setBW(${wk})">WEEK ${wk}</button>`).join('')}
    </div>
    <div class="card-accent" style="margin-bottom:12px"><p class="small">${bridgeNotes[w-1]}</p></div>
    <div class="day-tabs">
      ${subTabs.map((t,i)=>`<button class="dtab ${state.bridgeSubTab===t?'active':''}" onclick="setBST('${t}')">${subLabels[i]}</button>`).join('')}

    ${state.bridgeSubTab==='gtg'?renderGtG(w,pu,daily,targets,dpct):''}
    ${state.bridgeSubTab==='armstrong'?renderArmstrong():''}

      <div class="label label-green" style="margin-bottom:6px">AFTER WEEK 4</div>

function renderGtG(w,pu,daily,targets,dpct){
  return `
    <div class="card-blue" style="margin-bottom:12px">
      <div class="label label-blue" style="margin-bottom:8px">WHAT IS GREASE THE GROOVE? — PAVEL TSATSOULINE</div>
      <p class="small" style="margin-bottom:8px">Coined by Pavel Tsatsouline (former Soviet Special Forces instructor, founder of StrongFirst), Grease the Groove is built on one idea: <strong style="color:#e0dbd0">strength is a skill, not just a product of muscle size.</strong> Skills improve through repetition, not exhaustion.</p>
      <p class="small" style="margin-bottom:8px">Instead of doing hard fatiguing sets in a single workout, you spread sub-maximal reps across the entire day. Your nervous system builds new neural pathways — better wiring — without ever breaking down muscle tissue. This is called <strong style="color:#82aacc">neurological adaptation.</strong></p>
      <p class="small" style="margin-bottom:8px">Pavel's father-in-law example: every time he went to the basement, he did 5 chin-ups. Random timing, never to failure. He averaged 25–100 reps per day. When he tested himself weeks later, he hit 20 consecutive reps — something he hadn't done even as a young Marine.</p>
      <p class="small">The critical rule: <strong style="color:#c8963e">never go to failure. Ever.</strong> If your max is 10 pull-ups, train with 5. If a set slows down or form breaks — stop. Every rep must look identical. Failure trains the nervous system to fail. Success trains it to succeed.</p>
    </div>
    <div class="pavel-note"><p>"Muscle failure is more than unnecessary — it is counterproductive. If your body fails to perform your brain's command, the groove will get rusty." — Pavel Tsatsouline</p></div>

    <div class="label label-amber" style="margin-top:14px;margin-bottom:8px">EVERY BAR VISIT — DO THIS IN ORDER</div>
    <div class="card" style="margin-bottom:12px">
      ${[
        {n:'1',color:'#c8963e',title:'Attempt one full pull-up',desc:'Every single time you approach the bar — attempt one honest full pull-up first. Dead hang start, chin over bar. If it happens, great. If not, no problem. The nervous system needs to practice the actual movement pattern even before it can complete it. This is the attempt that eventually turns into the first rep.'},
        {n:'2',color:'#82aacc',title:'Drop into your current progression level',desc:'Whatever stage you\'re at below — do 1–3 reps of that movement and walk away. Never to failure, never to fatigue. Random timing throughout the day is fine and actually preferred.'},
        {n:'3',color:'#4caf7d',title:'Walk away',desc:'That\'s it. No more. The whole session at the bar is under 30 seconds. You\'ll come back again later.'},
      ].map(s=>`
        <div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-start">
          <div style="min-width:26px;height:26px;border-radius:50%;background:${s.color};color:#0c0e12;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:sans-serif;flex-shrink:0">${s.n}</div>
          <div><div style="font-size:12px;font-weight:700;color:#fff;font-family:sans-serif;margin-bottom:3px">${s.title}</div><p class="small">${s.desc}</p></div>
        </div>`).join('')}

    <div class="label label-amber" style="margin-bottom:8px">PULL-UP PROGRESSION LADDER — WHERE ARE YOU?</div>
    ${[
      {stage:'Stage 1',title:'Dead Hang',load:'Bodyweight',desc:'Just hang. Full dead hang, arms completely straight, as long as you can hold. This builds the grip, shoulder stability, and lat activation that pull-ups require. Do this every bar visit in place of the pull-up attempt until it feels solid.'},
      {stage:'Stage 2',title:'Scapular Pull-Ups',load:'Bodyweight',desc:'Dead hang, then WITHOUT bending your elbows, squeeze your shoulder blades down and together — your body rises slightly. Release. Repeat. This teaches your lats to fire before your arms take over. Most people who can\'t do pull-ups are missing this firing pattern.'},
      {stage:'Stage 3',title:'Negative Pull-Ups',load:'Bodyweight — eccentric only',desc:'Jump or step up so your chin is over the bar. Then lower yourself as slowly as possible — aim for 5–10 seconds down. Step down, reset, repeat. Negatives build pull-up strength faster than almost anything else because your muscles are stronger in the lowering phase than the lifting phase.'},
      {stage:'Stage 4',title:'Band-Assisted Pull-Ups',load:'Light or medium band',desc:'Loop a resistance band over the bar, put your knee or foot in it. The band takes some of your bodyweight on the way up. As you get stronger, use a lighter band. Do 1–3 reps per bar visit, never to failure.'},
      {stage:'Stage 5',title:'First Full Pull-Up',load:'Bodyweight',desc:'Usually happens within 4–8 weeks of consistent negatives and band work. When it happens — log it. Then go back to 1–2 reps per visit and build the groove from there.'},
    ].map(s=>`
      <div class="get-up-step" style="margin-bottom:8px">

        <div class="step-content">
          <h4>${s.title} <span style="color:#c8963e;font-size:10px;font-family:sans-serif;font-weight:400;margin-left:6px">${s.load}</span></h4>
          <p>${s.desc}</p>
        </div>
      </div>`).join('')}

    <div class="label label-amber" style="margin-top:14px;margin-bottom:8px">PULL-UP LOG — WEEK ${w}</div>
    <div class="card">
      <p class="small" style="margin-bottom:12px">Target <strong style="color:#c8963e">5–8 bar visits per day</strong> — Pavel's actual prescription. Not 3 scheduled sets. Every time you walk past the bar at home or the station, stop and do your reps. Random timing is better than scheduled — it keeps the nervous system guessing. Log each visit below. Count full pull-ups, negatives, band-assisted, or scapular reps — all count.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        ${[1,2,3,4,5,6,7,8].map(i=>`
          <div class="inp-wrap">

        <span style="font-size:10px;color:#5a6270;font-family:sans-serif;letter-spacing:1px">DAILY TOTAL vs WEEK ${w} TARGET</span>
        <span style="font-size:10px;color:#c8963e;font-family:sans-serif">${daily} / ${targets[w-1]} reps</span>

      <div style="font-size:13px;color:#c8963e;font-family:sans-serif;font-weight:700;margin-bottom:6px">Today: ${daily} reps</div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${dpct}%"></div></div>
    </div>`;
}

      <p class="small">The 7-position Turkish Get-Up taught step by step. Master each position before moving to the next weight. Practice during Bridge Phase so you arrive at S&S with the pattern automatic.</p>
    </div>
    ${getUpSteps.map(s=>`
      <div class="get-up-step">
        <div class="step-num ${s.n<=6?'':'blue'}">${s.n}</div>
        <div class="step-content">
          <h4>${s.title} <span style="color:#c8963e;font-size:10px;font-family:sans-serif;font-weight:400;margin-left:6px">${s.load}</span></h4>
          <p>${s.desc}</p>
        </div>
      </div>`).join('')}`;
}

function renderSSPair(){
  return `
    <div class="card-green" style="margin-bottom:12px">
      <div class="label label-green" style="margin-bottom:8px">BEST PAIRINGS WITH S&S</div>
      <p class="small">S&S is designed as a foundation, not the whole house. Pavel is clear on this — S&S builds the engine, you choose what you drive.</p>
    </div>
    ${[
      ['✅ Rucking — IDEAL','S&S builds posterior chain and grip. Rucking builds aerobic base. They don\'t compete at all — different energy systems, different demands. Ruck 2–3x/week at your current progression weight. This is arguably the best possible combination for a firefighter long-term.','card-green'],
      ['✅ GtG Pull-Ups — IDEAL','S&S has zero upper body pulling. GtG pull-ups fill that gap without adding recovery debt. 1-3 reps every time you pass the bar, daily, forever. This is your permanent pulling practice.','card-green'],
      ['✅ Easy Zone 2 Running','Pairs well. S&S doesn\'t drain the aerobic system, so running 3x/week alongside it is fine. Marathon training pairs naturally with S&S for the same reason — both build the engine without competing.','card-green'],
      ['⚠️ Heavy lifting programs','Too much CNS overlap with the Get-Up. If you run JTF2 and S&S simultaneously, reduce JTF2 strength volume significantly. Better to run them sequentially — JTF2 builds the peak, S&S maintains it.','card'],
      ['❌ High-volume metcons or CrossFit','Directly competes with S&S recovery. The whole point of S&S is sustainable daily practice — stacking metabolic conditioning on top defeats the recovery architecture.','card-red'],
    ].map(([title,desc,cardClass])=>`
      <div class="${cardClass}" style="margin-bottom:10px">
        <h3 style="font-size:12px;margin-bottom:6px">${title}</h3>
        <p class="small">${desc}</p>
      </div>`).join('')}
    <div class="card-accent" style="margin-top:4px">
      <div class="label label-amber" style="margin-bottom:6px">YOUR LONG-TERM DAILY STRUCTURE AFTER JTF2</div>
      ${[['Daily','S&S — swings + Get-Ups · ~30 min'],['Daily','GtG pull-ups — 1-3 reps per pass, spread through the day'],['3×/week','Easy run OR ruck at current progression weight'],['Occasional','Iron Core 4-min finisher after S&S if fresh']].map(([freq,act])=>`
        <div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start">
          <span style="min-width:70px;font-size:10px;color:#c8963e;font-weight:700;font-family:sans-serif;letter-spacing:.5px">${freq}</span>
          <span style="font-size:12px;color:#c0bab0;font-family:sans-serif">${act}</span>
        </div>`).join('')}
    </div>`;
}

function renderSSStandards(){
  return `
    <div class="card" style="margin-bottom:12px">
      <p class="body">S&S has two standards. Both use the same protocol — 100 swings + 10 Get-Ups. The only variable is weight and time. Your entry point is far below Simple Standard — that\'s correct and expected.</p>
    </div>
    ${ssStandards.map(s=>`
      <div class="card" style="margin-bottom:10px">
        <h3>${s.name}</h3>
        <div class="bench-grid">
          <div class="bench-cell" style="background:#1a1608"><div class="label label-amber">SWING WEIGHT</div><div class="val">${s.swing}</div></div>
          <div class="bench-cell" style="background:#1a1608"><div class="label label-amber">GET-UP WEIGHT</div><div class="val">${s.getup}</div></div>
          <div class="bench-cell" style="background:#161920"><div class="label label-muted">TIME GOALS</div><div class="val" style="font-size:10px">${s.swingTime}<br>${s.getupTime}</div></div>
        </div>
        <p class="small" style="padding-top:8px;border-top:1px solid #252a35">${s.desc}</p>
      </div>`).join('')}
    <div class="label label-amber" style="margin-bottom:8px;margin-top:4px">YOUR PROGRESSION ROADMAP</div>
    ${ssProgression.map((p,i)=>`
      <div class="standard-row">
        <div>
          <div style="font-size:11px;font-weight:700;color:#fff;font-family:sans-serif;margin-bottom:3px">${p.phase}</div>
          <div style="font-size:11px;color:#9a9490;font-family:sans-serif">Swing: ${p.swing}</div>
          <div style="font-size:11px;color:#9a9490;font-family:sans-serif">Get-Up: ${p.getup}</div>
          <div style="font-size:11px;color:#c8963e;font-family:sans-serif;margin-top:3px">Pair with: ${p.pair}</div>
        </div>
        <div style="font-size:20px;color:#252a35">${i===0?'→':i===1?'→':'⭐'}</div>
      </div>`).join('')}`;
}

function renderIronCore(){
  return `
    <div class="card-accent" style="margin-bottom:14px">
      <div class="label label-amber" style="margin-bottom:6px">IRON CORE PROTOCOL</div>
      <h2>4-Minute Core Finisher</h2>
      <p class="body" style="margin-top:6px">Use on Day 4 (rest/active recovery) when genuinely fresh, or after S&S if feeling good. 4 rounds of 45 sec work / 15 sec rest, alternating floor and standing.</p>
    </div>
    ${[
      {n:1,side:'FLOOR',color:'#82aacc',bg:'ic-floor',time:'0:00 to 0:45',name:'KB Plank Pull-Throughs',desc:'Rigid push-up plank, feet wide. Place 35 lb KB just behind your left wrist. Reach under with your right hand, drag the bell across to the right side. Switch hands, drag back. Slow is hard — 3–4 seconds per drag, hips must not tilt or rotate.',cue:'WHY: Anti-rotation forces the entire abdominal wall into massive isometric tension to keep hips square.'},
      {n:2,side:'STANDING',color:'#c8963e',bg:'ic-standing',time:'1:00 to 1:45',name:'Sledgehammer Kayaks',desc:'Feet hip-width, grip sledgehammer like a kayak paddle with one hand at the very bottom tip. Aggressively carve a tight figure-8 — slice hammer head down past left hip, then up and down past right hip.',cue:'CUE: Freeze your lower body. Hips do not swing. Obliques do 100% of the braking and twisting.'},
      {n:3,side:'FLOOR',color:'#82aacc',bg:'ic-floor',time:'2:00 to 2:45',name:'KB Plank Pull-Throughs',desc:'Same as Round 1. If it feels easy you\'re going too fast — slow the drag to 4 seconds per side. Elevate feet on a step to increase load if needed.',cue:''},
      {n:4,side:'STANDING',color:'#c8963e',bg:'ic-standing',time:'3:00 to 3:45',name:'Sledgehammer Kayaks',desc:'Final round — obliques should be clearly fatigued. Maintain form over speed. Alternate lead hand from Round 2.',cue:''},
    ].map(r=>`
      <div style="display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:6px;margin-bottom:8px;background:#151520">
        <div style="min-width:32px;height:32px;border-radius:50%;background:${r.color}33;color:${r.color};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:sans-serif;flex-shrink:0">${r.n}</div>
        <div>
          <div style="font-size:10px;font-weight:700;color:${r.color};font-family:sans-serif;margin-bottom:3px;letter-spacing:1px">ROUND ${r.n} — ${r.time} · ${r.side}</div>
          <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:4px">${r.name}</div>
          <p class="small">${r.desc}</p>
          ${r.cue?`<div style="margin-top:6px;font-size:10px;color:${r.color};font-family:sans-serif;letter-spacing:1px">${r.cue}</div>`:''}
        </div>
      </div>
      ${r.n<4?'<div style="text-align:center;padding:4px;font-size:10px;color:#5a6270;font-family:sans-serif;letter-spacing:1.5px">— REST 15 SEC —</div>':''}`).join('')}
    <div class="card" style="margin-top:10px">
      <div class="label label-amber" style="margin-bottom:8px">IF IT\'S TOO EASY</div>
      <p class="small">Slow the pull-through drag to 4 seconds per side and freeze completely between reps. Elevate feet on a step for the plank rounds. Don\'t add rounds — add tension. The goal is maximal isometric tension, not reps.</p>
    </div>`;
}

function renderBenchmarks(){
  return `
    <div class="card" style="margin-bottom:14px"><p class="body">JTF2 candidates are 25–32. You\'re 44, on shift rotation, managing knees. These <strong style="color:#c8963e">realistic targets</strong> represent genuine elite fitness for your profile.</p></div>
    ${benchmarks.map(b=>`
      <div class="card" style="margin-bottom:10px">
        <h3>${b.cat}</h3>
        <div class="bench-grid">
          <div class="bench-cell" style="background:#2d1e1e"><div class="label label-red">JTF2 / S&S STANDARD</div><div class="val">${b.jtf2}</div></div>
          <div class="bench-cell" style="background:#0e1a12"><div class="label label-green">YOUR TARGET</div><div class="val">${b.target}</div></div>
          <div class="bench-cell" style="background:#161920"><div class="label label-amber">START TEST</div><div class="val">${b.start}</div></div>
        </div>
        <p class="small" style="padding-top:8px;border-top:1px solid #252a35">${b.notes}</p>
      </div>`).join('')}`;
}

function renderProgression(){
  return `
    <div class="card-accent" style="margin-bottom:14px">
      <div class="label label-amber" style="margin-bottom:6px">3-CYCLE JTF2 PROGRESSION + S&S</div>
      <p class="body">JTF2 movements stay the same across 3 cycles — only the weights change. After Cycle 3, transition to S&S as your daily foundation. S&S progression is separate and runs indefinitely.</p>
    </div>
    <div style="overflow-x:auto">
    <table class="prog-table">
      <thead><tr>
        <th style="color:#7a8090">EXERCISE</th>
        <th style="color:#c8963e">CYCLE 1</th>
        <th style="color:#4caf7d">CYCLE 2</th>
        <th style="color:#4caf7d">CYCLE 3</th>
        <th style="color:#cf7a6a">JTF2 / S&S GOAL</th>
      </tr></thead>
      <tbody>${progression.map(r=>`<tr><td style="color:#fff;font-weight:600">${r.exercise}</td><td style="color:#c8963e">${r.c1}</td><td style="color:#4caf7d">${r.c2}</td><td style="color:#4caf7d">${r.c3}</td><td style="color:#cf7a6a">${r.jtf2}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="card" style="margin-top:14px">
      <div class="label label-amber" style="margin-bottom:8px">BAND PROGRESSION NOTE</div>
      <p class="small">When any DB exercise hits the 60 lb ceiling and feels comfortable, add a resistance band before buying heavier DBs. Bands add accommodating resistance — lighter at the bottom where you\'re weakest, heavier at the top where the movement is strongest. You\'re already doing this on RDL. Apply the same principle to: DB Row (band under foot), Goblet Squat (band through KB handle), Farmer Carry pick-up (band under feet at start).</p>
    </div>`;
}

// ─── HANDLERS ─────────────────────────────────────────────
function setBW(w){state.bridgeWeek=w;render();}
function setBST(t){state.bridgeSubTab=t;render();}
function setPW(w){state.progWeek=w;state.progDay=0;render();}
function setPD(d){state.progDay=d;render();}
function setSSST(t){state.ssSubTab=t;render();}
function toggleDay(key){db.bridge.days[key]=!db.bridge.days[key];saveDB();toast(db.bridge.days[key]?'Day logged ✓':'Day unmarked');render();}
function updatePU(week,field,val){db.bridge.pullups[week][field]=val;saveDB();render();}
function updateGU(week,field,val){db.bridge.getup[week][field]=val;saveDB();toast('Saved');}
function updateSSLog(field,val){
  const today=state.ssDay;
  if(!db.ss.log[today]) db.ss.log[today]={swingWeight:'',swingTime:'',getupWeight:'',getupTime:'',notes:''};
  db.ss.log[today][field]=val;
  saveDB();toast('Saved');
}

render();
</script>
</body>
</html>
